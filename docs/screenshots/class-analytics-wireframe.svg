<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative PRISM class analytics wireframe</title>
  <desc id="desc">A neutral wireframe showing computed class indicators, concept mastery, and a teaching recommendation.</desc>
  <rect width="1400" height="820" fill="#eef2f3"/>
  <rect x="42" y="28" width="1316" height="764" rx="18" fill="#ffffff" stroke="#c9d4d7"/>
  <rect x="42" y="28" width="1316" height="68" rx="18" fill="#0f5864"/>
  <text x="76" y="71" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">PRISM</text>
  <text x="1082" y="69" fill="#dcebed" font-family="Arial, sans-serif" font-size="16">Class insights</text>
  <text x="76" y="148" fill="#19343b" font-family="Arial, sans-serif" font-size="30" font-weight="700">Machine learning · class evidence</text>
  <text x="76" y="181" fill="#61767c" font-family="Arial, sans-serif" font-size="16">Computed from saved criterion evaluations and teacher decisions</text>
  <g font-family="Arial, sans-serif">
    <rect x="76" y="224" width="280" height="132" rx="12" fill="#f3f7f7"/>
    <text x="100" y="258" fill="#61767c" font-size="15">Average score</text>
    <text x="100" y="315" fill="#19343b" font-size="38" font-weight="700">72%</text>
    <rect x="382" y="224" width="280" height="132" rx="12" fill="#f3f7f7"/>
    <text x="406" y="258" fill="#61767c" font-size="15">Criteria reviewed</text>
    <text x="406" y="315" fill="#19343b" font-size="38" font-weight="700">18</text>
    <rect x="688" y="224" width="280" height="132" rx="12" fill="#f3f7f7"/>
    <text x="712" y="258" fill="#61767c" font-size="15">Students assessed</text>
    <text x="712" y="315" fill="#19343b" font-size="38" font-weight="700">5</text>
  </g>
  <rect x="76" y="394" width="590" height="320" rx="14" fill="#ffffff" stroke="#d2dfe1"/>
  <text x="108" y="436" fill="#19343b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Concept mastery</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="110" y="486" fill="#405c64">Gradient direction</text><rect x="110" y="502" width="350" height="13" rx="6" fill="#dbe7e9"/><rect x="110" y="502" width="294" height="13" rx="6" fill="#0f8994"/><text x="480" y="514" fill="#19343b">84%</text>
    <text x="110" y="556" fill="#405c64">Learning-rate effects</text><rect x="110" y="572" width="350" height="13" rx="6" fill="#dbe7e9"/><rect x="110" y="572" width="193" height="13" rx="6" fill="#c98738"/><text x="480" y="584" fill="#19343b">55%</text>
    <text x="110" y="626" fill="#405c64">Convergence</text><rect x="110" y="642" width="350" height="13" rx="6" fill="#dbe7e9"/><rect x="110" y="642" width="245" height="13" rx="6" fill="#0f8994"/><text x="480" y="654" fill="#19343b">70%</text>
  </g>
  <rect x="704" y="394" width="618" height="320" rx="14" fill="#f5faf8" stroke="#cfe4d8"/>
  <text x="738" y="436" fill="#19343b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Teaching recommendation</text>
  <text x="738" y="488" fill="#46626a" font-family="Arial, sans-serif" font-size="17">Review learning-rate effects next.</text>
  <text x="738" y="524" fill="#46626a" font-family="Arial, sans-serif" font-size="16">Several criteria show partial understanding;</text>
  <text x="738" y="550" fill="#46626a" font-family="Arial, sans-serif" font-size="16">use a short worked example and re-check</text>
  <text x="738" y="576" fill="#46626a" font-family="Arial, sans-serif" font-size="16">the misconception against paper evidence.</text>
  <text x="738" y="670" fill="#71858a" font-family="Arial, sans-serif" font-size="14">Illustrative wireframe — values are placeholders.</text>
</svg>
